name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: Firmware host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake -S firmware/test -B firmware/build/test -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build firmware/build/test --parallel
      - name: Test
        run: ctest --test-dir firmware/build/test --output-on-failure

  relay:
    name: Relay tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Relay suite
        working-directory: relay
        run: npm test

  evals:
    name: Offline evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Offline only. The --live suites need a provider key and are not run here.
      - name: Eval suites
        working-directory: evals
        run: npm run eval

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The exact version, from pip so it is identical on every platform.
      # clang-format's output changes between majors, so a floor ("21 or newer")
      # makes CI and a contributor on 23 disagree with each other forever.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install clang-format
        run: pip install clang-format==21.1.2
      - name: Check formatting
        working-directory: firmware
        run: |
          ./bin/clang-format-fix
          git diff --exit-code || {
            echo "::error::clang-format made changes. Run ./bin/clang-format-fix and commit."
            exit 1
          }

  build:
    name: Build ${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # inkagent-check compiles the [env:default] sources without the custom
        # SDK rebuild, which is what makes a firmware compile viable in CI.
        env: [inkagent-check, x4pro, x4c, papermono]
        blocking: [true]
        include:
          # sticky is the only firmware_tuned environment here, and the only one
          # that fails: after the ESP-IDF core rebuild completes, the nested
          # Arduino compile dies with
          #   ModuleNotFoundError: No module named 'SCons.Tool.FortranCommon'
          # even though the pinned tool-scons 4.8.1 demonstrably contains that
          # module (checked in both the pioarduino and the platformio builds of
          # the package). Something in that nested invocation resolves a
          # different SCons and we do not yet know which.
          #
          # Non-blocking rather than deleted: the build still runs and still
          # reports, so the diagnostic below keeps arriving and the day it
          # passes we flip this back. Blocking on a failure we cannot explain
          # would only teach people to ignore a red main.
          - env: sticky
            blocking: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware/.cache
          # The Core version is part of the key: a cache saved under 6.2.0
          # carries its tool-scons back in and reintroduces the link failure.
          key: pio-6.1.19-${{ matrix.env }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: pio-6.1.19-${{ matrix.env }}-
      # PlatformIO Core is pinned, not merely installed: 6.2.0 requires
      # tool-scons ~4.41101.0 (SCons 4.11), whose Fortran tool modules import
      # SCons.Tool.FortranCommon — removed in 4.9. The pioarduino custom-SDK
      # rebuild loads those tools, so firmware_tuned envs die at link with
      # ModuleNotFoundError. 6.1.19 requires tool-scons ~4.40801.0 (SCons 4.8.1),
      # which still has it, and matches what developers run locally.
      #
      # Pinning the tool alone does not work: Core re-resolves its own
      # requirement mid-build and uninstalls the pin.
      - name: Install PlatformIO
        run: pip install "platformio==6.1.19"
      # Which SCons actually answers, and whether it has the module the
      # nested Arduino compile cannot find. Cheap, and it turns the sticky
      # failure into evidence instead of another guess.
      - name: SCons diagnostic
        working-directory: firmware
        continue-on-error: true
        run: |
          echo "--- pio core ---"; pio --version
          echo "--- tool-scons packages ---"
          find ~/.platformio/packages -maxdepth 1 -name 'tool-scons*' -exec cat {}/.piopm \; 2>/dev/null || true
          echo "--- FortranCommon present? ---"
          find ~/.platformio/packages -name 'FortranCommon*' 2>/dev/null | head
          echo "--- any other SCons on this runner ---"
          python -c "import SCons, os; print('python SCons', SCons.__version__, os.path.dirname(SCons.__file__))" 2>&1 | tail -1
          pip list 2>/dev/null | grep -i scons || echo "no pip scons"

      - name: Build
        working-directory: firmware
        continue-on-error: ${{ !matrix.blocking }}
        run: pio run -e ${{ matrix.env }}
